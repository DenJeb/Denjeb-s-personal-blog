name: CI

on:
  push:
    branches: [main, master, phase-3-admin]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog_test
          MYSQL_USER: blog
          MYSQL_PASSWORD: blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ublog -pblog"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql+pymysql://blog:blog@127.0.0.1:3306/blog_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://blog:blog@127.0.0.1:3306/blog_test?charset=utf8mb4
      SECRET_KEY: ci-only-secret-key-not-for-production
      ADMIN_EMAIL: __pytest_admin@example.com
      DEBUG: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Pytest
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Pytest failure"
              echo '```'
              tail -200 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Alembic check
        run: alembic check
