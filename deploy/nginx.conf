# /etc/nginx/sites-available/blog
# 把 yourdomain.com 和 /srv/blog 替换成实际值。
#
# 生产同源路由：
#   Next.js :3000 —— 公开前台、/login、/admin、/admin/posts
#   FastAPI :8000 —— API、静态文件、后台登录/其余后台页、账户页、feed
# 这样浏览器只面对一个域名，Session、CSRF 和 __Host- Cookie 都不需要跨域。

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    # 兼容 Ubuntu 24.04 自带的 Nginx 1.24；1.25+ 会提示该写法废弃，但仍可用。
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 6M;
    server_tokens off;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 静态文件由 Nginx 直接提供，路径按实际部署目录修改
    location /static/uploads/ {
        alias /srv/blog/app/static/uploads/;
        expires 7d;
        access_log off;
    }

    location /static/ {
        alias /srv/blog/app/static/;
        expires 1h;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # Phase 3a：Next.js 后台仪表盘和文章列表。
    # 正则 location 优先于下面的 /admin 前缀，因此 /admin/login、编辑/审核等
    # 未迁移路径仍会落到 FastAPI。
    location ~ ^/admin(/posts)?/?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # 后台登录和其余后台页面由 FastAPI + Jinja2 提供。
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8000;
    }

    # 密码登录页由 Next.js 提供；验证码等 /login/* 子路径仍走 FastAPI。
    location = /login {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location ^~ /login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/(register|forgot-password|reset-password|account)(/|$) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /rss.xml {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
    }

    # 公开前台由 Next.js 动态 SSR 提供。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
