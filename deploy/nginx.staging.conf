# /etc/nginx/sites-available/blog-staging
# 第一阶段 staging：/ 走 Next.js，API/静态/后台/账户/feed 继续走 FastAPI。
# 生产配置 deploy/nginx.conf 保持不变，验收通过后再切换。

# staging 使用独立 zone 名，避免与 deploy/nginx.conf 同时启用时 duplicate zone。
limit_req_zone $binary_remote_addr zone=login_staging:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_staging:10m rate=20r/m;

server {
    listen 80;
    server_name staging.yourdomain.com;

    client_max_body_size 6M;
    server_tokens off;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /static/uploads/ {
        alias /srv/blog/app/static/uploads/;
        expires 7d;
        access_log off;
    }

    location /static/ {
        alias /srv/blog/app/static/;
        expires 1h;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # 后台登录/账户路径继续由 FastAPI/Jinja2 提供，限流规则保持。
    location = /admin/login {
        limit_req zone=login_staging burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:8000;
    }

    # Phase 2：密码登录页由 Next.js 提供；邮箱验证码等 /login/* 子路径仍走 FastAPI。
    location = /login {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /login {
        limit_req zone=auth_staging burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/(register|forgot-password|reset-password|account) {
        limit_req zone=auth_staging burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /rss.xml {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
    }

    # 公开前台由 Next.js 动态 SSR 提供。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
