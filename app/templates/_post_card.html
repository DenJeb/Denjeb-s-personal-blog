{% set post_tags = post.sorted_tags or post.tags %}
<article>
  <header>
    <h2><a href="{{ url_for('post_detail', post_id=post.id) }}">{{ post.title }}</a></h2>
    <p>
      <small>
        {{ post.published_at }}
        {% if post_tags %}
          · {% for tag in post_tags %}<a href="{{ tag_url(tag) }}">{{ tag }}</a>{% if not loop.last %} / {% endif %}{% endfor %}
        {% endif %}
      </small>
    </p>
  </header>
  <p>{{ post.summary }}</p>
</article>
