{% extends "admin/login_base.html" %}

<!--
========== 后台两步验证 ==========
-->

{% block title %}两步验证 · {{ app_name }}{% endblock %}

{% block content %}
  <hgroup>
    <h1>两步验证</h1>
    <p>请输入认证器中的 6 位验证码。</p>
  </hgroup>

  {% if error %}
    <p style="color: #c0392b;"><strong>{{ error }}</strong></p>
  {% endif %}

  <form method="post" action="{{ url_for('login_totp') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    {% if email %}<p><small>{{ email }}</small></p>{% endif %}
    <label>
      验证码
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" required autofocus>
    </label>
    <button type="submit">验证并登录</button>
  </form>

  <p><small><a href="{{ url_for('login_page') }}">返回登录</a></small></p>
{% endblock %}
