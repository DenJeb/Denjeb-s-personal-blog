<tr>
  <td>
    <a href="{{ url_for('moments_page') }}{% if public_page > 1 %}?page={{ public_page }}{% endif %}#moment-{{ comment.moment_id }}" target="_blank" rel="noopener">动态 #{{ comment.moment_id }}</a>
  </td>
  <td>{{ comment.author_name }}</td>
  <td title="{{ comment.content }}">{{ comment.content[:80] }}{% if comment.content | length > 80 %}…{% endif %}</td>
  <td>{{ comment.created_at.strftime("%Y-%m-%d %H:%M") }}</td>
  <td>
    {% if comment.is_approved %}
      <ins>已通过</ins>
    {% else %}
      <mark>待审核</mark>
    {% endif %}
  </td>
  <td>
    <form method="post" action="{{ url_for('moment_comment_approve', comment_id=comment.id) }}"
          hx-post="{{ url_for('moment_comment_approve', comment_id=comment.id) }}"
          hx-target="closest tr" hx-swap="outerHTML" hx-disabled-elt="find button">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="page" value="{{ page }}">
      <button type="submit" class="secondary outline">{{ "取消审核" if comment.is_approved else "通过" }}</button>
    </form>
    <a href="{{ url_for('moment_comment_delete_confirm', comment_id=comment.id) }}{% if page > 1 %}?page={{ page }}{% endif %}">删除</a>
  </td>
</tr>
