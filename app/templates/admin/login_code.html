{% extends "admin/login_base.html" %}

<!--
========== 后台邮箱验证码 ==========
-->

{% block title %}邮箱验证 · {{ app_name }}{% endblock %}

{% block content %}
  <hgroup>
    <h1>邮箱验证</h1>
    <p>验证码已发送到管理员邮箱，10 分钟内有效。</p>
  </hgroup>

  {% if error %}
    <p style="color: #c0392b;"><strong>{{ error }}</strong></p>
  {% endif %}
  {% if sent %}
    <p><mark>新的验证码已发送。</mark></p>
  {% endif %}

  {% if email %}<p><small>{{ email }}</small></p>{% endif %}

  <form method="post" action="{{ url_for('login_code_verify') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>
      邮箱验证码
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" required autofocus>
    </label>
    <button type="submit">验证并继续</button>
  </form>

  <form method="post" action="{{ url_for('login_code_resend') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <button type="submit" class="secondary outline">重新发送验证码</button>
  </form>

  <p><small><a href="{{ url_for('login_page') }}">返回登录</a></small></p>
{% endblock %}
