{% extends "admin/base.html" %}

<!--
========== 后台分类编辑 ==========
-->

{% block title %}{% if category %}编辑分类{% else %}新建分类{% endif %} · {{ app_name }}{% endblock %}

{% block content %}
  <hgroup>
    <h1>{% if category %}编辑分类{% else %}新建分类{% endif %}</h1>
    <p>分类标识用于 URL，建议使用小写字母、数字、下划线和短横线。</p>
  </hgroup>

  {% if error %}
    <p style="color: #c0392b;"><strong>{{ error }}</strong></p>
  {% endif %}

  <form method="post" action="{% if category %}{{ url_for('category_edit', category_id=category.id) }}{% else %}{{ url_for('category_create') }}{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>
      标识
      <input type="text" name="slug" value="{{ form.slug }}" maxlength="50" required>
    </label>
    <label>
      名称
      <input type="text" name="name" value="{{ form.name }}" maxlength="100" required>
    </label>
    <button type="submit">保存</button>
    <a href="{{ url_for('admin_categories') }}" role="button" class="secondary">取消</a>
  </form>
{% endblock %}
