{% extends "admin/login_base.html" %}

<!--
========== 后台登录 ==========
-->

{% block title %}后台登录 · {{ app_name }}{% endblock %}

{% block content %}
  <hgroup>
    <h1>后台登录</h1>
    <p>{% if code_enabled %}邮箱 + 密码验证后，还会向管理员邮箱发送验证码。{% else %}输入管理员邮箱和密码。{% endif %}</p>
  </hgroup>

  {% if error %}
    <p style="color: #c0392b;"><strong>{{ error }}</strong></p>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>
      管理员邮箱
      <input type="email" name="username" value="{{ username or '' }}" required autofocus>
    </label>
    <label>
      密码
      <input type="password" name="password" required>
    </label>
    <button type="submit">登录</button>
  </form>
{% endblock %}
