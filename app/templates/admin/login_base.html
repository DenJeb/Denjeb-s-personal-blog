<!DOCTYPE html>
<!--
========== 后台登录布局 ==========
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}后台登录 · {{ app_name }}{% endblock %}</title>
  {% include "_theme_head.html" %}
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="{{ url_for('index') }}">{{ app_name }}</a></strong></li>
      </ul>
      <ul>
        {% include "_theme_button.html" %}
      </ul>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', path='/js/theme.js') }}"></script>
</body>
</html>
