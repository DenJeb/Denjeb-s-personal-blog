{% extends "admin/base.html" %}

<!--
========== 后台删除确认 ==========
-->

{% block title %}确认删除 · {{ app_name }}{% endblock %}

{% block content %}
  <hgroup>
    <h1>确认删除</h1>
    <p>此操作不可恢复。</p>
  </hgroup>

  <article>
    <header><strong>{{ item_title }}</strong></header>
    <p>确定要删除这条{{ item_type }}吗？</p>

    <form method="post" action="{{ delete_url }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <button type="submit" class="secondary">确认删除</button>
      <a href="{{ cancel_url }}" role="button" class="secondary outline">取消</a>
    </form>
  </article>
{% endblock %}
