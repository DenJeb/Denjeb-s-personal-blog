{% extends "base.html" %}

<!--
========== 学习笔记详情 ==========
-->

{% block title %}{{ note.title }} · {{ app_name }}{% endblock %}

{% block content %}
  <article>
    <header>
      <h1>{{ note.title }}</h1>
      <p>
        <small>
          {{ note.published_at }} ·
          <a href="{{ url_for('category_page', category_slug=note.category.slug) }}">{{ note.category.name }}</a>
        </small>
      </p>
    </header>
    <p>{{ note.content }}</p>
  </article>

  <p><a href="{{ url_for('notes_page') }}">← 返回笔记列表</a></p>
{% endblock %}
