{% extends "base.html" %}

<!--
========== 重置密码 ==========
-->

{% block title %}重置密码 · {{ app_name }}{% endblock %}
{% block description %}重置 {{ app_name }} 密码{% endblock %}

{% block content %}
  <hgroup>
    <h1>重置密码</h1>
    <p>验证码已发送到 {{ email }}（如果账号存在）。</p>
  </hgroup>

  {% if error %}
    <p style="color: #c0392b;"><strong>{{ error }}</strong></p>
  {% endif %}

  <form method="post" action="{{ url_for('user_reset_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>
      验证码
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
    </label>
    <label>
      新密码（至少 8 位）
      <input type="password" name="password" minlength="8" required>
    </label>
    <label>
      确认新密码
      <input type="password" name="confirm" minlength="8" required>
    </label>
    <button type="submit">重置密码</button>
  </form>
{% endblock %}
