{% extends "base.html" %}

<!--
========== 注销账号 ==========
-->

{% block title %}注销账号 · {{ app_name }}{% endblock %}
{% block description %}注销 {{ app_name }} 账号{% endblock %}

{% block content %}
  <hgroup>
    <h1>注销账号</h1>
    <p>当前账号：{{ user.email or user.username }}</p>
  </hgroup>

  <p><mark>注销后无法恢复，且该邮箱 24 小时内不能重新注册。</mark></p>

  {% if error %}
    <p style="color: #c0392b;"><strong>{{ error }}</strong></p>
  {% endif %}

  <form method="post" action="{{ url_for('user_delete_account') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>
      输入密码确认
      <input type="password" name="password" required autofocus>
    </label>
    <button type="submit" class="secondary">确认注销</button>
  </form>

  <p><a href="{{ url_for('index') }}">取消并返回首页</a></p>
{% endblock %}
