{% extends "base.html" %}

<!--
========== 笔记分类页 ==========
-->

{% block title %}{{ category.name }} · {{ app_name }}{% endblock %}

{% block content %}
  <hgroup>
    <h1>{{ category.name }}</h1>
    <p>该分类下的学习笔记</p>
  </hgroup>

  {% for note in notes %}
    <article>
      <header>
        <h2><a href="{{ url_for('note_detail', note_id=note.id) }}">{{ note.title }}</a></h2>
        <p><small>{{ note.published_at }}</small></p>
      </header>
      <p>{{ note.summary }}</p>
    </article>
  {% else %}
    <p>这个分类下还没有笔记。</p>
  {% endfor %}

  <p><a href="{{ url_for('notes_page') }}">← 返回笔记列表</a></p>
{% endblock %}
